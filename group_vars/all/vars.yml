---
# ---- Site (override any of these per host in inventory or host_vars/<host>.yml) ----
wp_domain: "{{ inventory_hostname }}"
wp_site_url: "http://{{ wp_domain }}"
wp_site_title: "WordPress on {{ inventory_hostname }}"
wp_admin_user: admin
wp_admin_email: "admin@{{ wp_domain }}"
wp_admin_password: "{{ vault_wp_admin_password }}"
wp_install_dir: /var/www/wordpress
wp_locale: en_US

# ---- Database (local to each server) ----
wp_db_name: wordpress
wp_db_user: wp_user
wp_db_password: "{{ vault_wp_db_password }}"
wp_db_prefix: wp_
db_host: localhost

# ---- Firewall (ufw) ----
firewall_enabled: true
ssh_port: 22

# ---- Misc ----
server_timezone: Africa/Nairobi
