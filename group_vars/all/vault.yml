---
# Change these, then encrypt this file:
#   ansible-vault encrypt group_vars/all/vault.yml
#
# These are defaults for every server. To give one server different
# passwords, create host_vars/<host>.yml (also vault-encrypted) and
# set vault_wp_db_password / vault_wp_admin_password there.
vault_wp_db_password: "ChangeMe-DbPass-2026"
vault_wp_admin_password: "ChangeMe-AdminPass-2026"

# Secret used to derive each site's WordPress keys/salts.
# Each server gets different salts (seed + hostname), and they stay the
# same on every run, so nothing has to be stored on disk. Set once, never change.
vault_wp_salt_seed: "ChangeMe-long-random-string"
