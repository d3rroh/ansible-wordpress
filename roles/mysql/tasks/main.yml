---
- name: Install MySQL server
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present

- name: Deploy MySQL config (localhost only)
  ansible.builtin.template:
    src: zz-wordpress.cnf.j2
    # "zz-" so it loads after the distro's mysqld.cnf and wins
    dest: "{{ mysql_conf_dir }}/zz-wordpress.cnf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart mysql

- name: Ensure MySQL is running and enabled
  ansible.builtin.service:
    name: "{{ mysql_service }}"
    state: started
    enabled: true

- name: Apply config changes before creating users
  ansible.builtin.meta: flush_handlers

- name: Create WordPress database
  ansible.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_unix_socket: "{{ mysql_socket }}"

- name: Create local WordPress DB user
  ansible.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    host: localhost
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ mysql_socket }}"
  no_log: true

- name: Remove anonymous MySQL users
  ansible.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ mysql_socket }}"

- name: Remove test database
  ansible.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ mysql_socket }}"
