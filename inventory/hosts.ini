# Every host in [wordpress] gets its OWN MySQL + its OWN WordPress site.
# Nothing is shared between servers.
#
# wp_domain is per host. Add more hosts the same way.

[wordpress]
wp1 ansible_host=203.0.113.11 wp_domain=site1.example.com
wp2 ansible_host=203.0.113.12 wp_domain=site2.example.com
wp3 ansible_host=203.0.113.13 wp_domain=site3.example.com

[wordpress:vars]
ansible_user=root
